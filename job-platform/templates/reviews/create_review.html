{% extends "base.html" %}
{% block title %}Leave a Review{% endblock %}
{% block page_title %}Leave a Review{% endblock %}
{% block content %}
    <h1>Review {{ reviewee.username }}</h1>
    <p>For contract: {{ contract.job.title }}</p>
    <form method="post" class="form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Submit Review</button>
    </form>
{% endblock %}
